name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main/tag runs mid-publish; only superseded PR runs
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.module }} (JDK 25)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ jte, jte-forms ]

    services:
      postgres:
        image: postgres:17.7-alpine3.21
        env:
          POSTGRES_DB: form
          POSTGRES_USER: yu71
          POSTGRES_PASSWORD: 53cret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yu71 -d form"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    env:
      # Spring Boot Docker Compose support is skipped in tests, so point jte-forms at the service container
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/form
      SPRING_DATASOURCE_USERNAME: yu71
      SPRING_DATASOURCE_PASSWORD: 53cret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports

  docker:
    name: Docker image ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: [ jte, jte-forms ]
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.module }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.module }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  release:
    name: Attach jars to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: '*/pom.xml'

      # Tests already ran in the build job; stamp the tag version into the jars without committing pom changes
      - name: Build jars
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          for module in jte jte-forms; do
            (cd "$module" \
              && ./mvnw -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false \
              && ./mvnw -B -ntp -DskipTests package)
            cp "$module/target/$module-$VERSION.jar" dist/
          done
          (cd dist && sha256sum -- *.jar > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create or update release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG 🏷️📦🚀" --generate-notes
          fi
