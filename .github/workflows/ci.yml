name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.module }} (JDK 25)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ jte, jte-forms ]

    services:
      postgres:
        image: postgres:17.7-alpine3.21
        env:
          POSTGRES_DB: form
          POSTGRES_USER: yu71
          POSTGRES_PASSWORD: 53cret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U yu71 -d form"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    env:
      # Spring Boot Docker Compose support is skipped in tests, so point jte-forms at the service container
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/form
      SPRING_DATASOURCE_USERNAME: yu71
      SPRING_DATASOURCE_PASSWORD: 53cret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports
